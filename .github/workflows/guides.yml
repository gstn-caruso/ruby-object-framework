name: Verify and publish guides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: guides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.8'
      - name: Install the SQLite adapter dependency
        run: gem install sqlite3 --version 2.10.1 --no-document
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install independent protocol clients
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r test/interop/requirements.txt
      - name: Run framework, protocol, and executable-guide scenarios
        run: ruby -Ilib:test test/run.rb
      - name: Build guides and verify links and anchors
        run: ruby tools/build_guides.rb
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload guide site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy guides
        id: deployment
        uses: actions/deploy-pages@v4
