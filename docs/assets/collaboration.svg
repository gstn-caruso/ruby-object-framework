<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">Order confirmation responsibilities</title><desc id="desc">A controller calls an invocation. The invocation owns the session and transaction and constructs a use case. The use case obtains an order from a repository and asks the order to confirm. Independent confirmation values return before commit and presentation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526779"/></marker></defs><g font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><rect x="12" y="40" width="135" height="70" rx="5" fill="#edf3f7" stroke="#cbd7df"/><text x="79" y="80" fill="#17334a">Controller</text><rect x="190" y="15" width="360" height="225" rx="6" fill="#fff" stroke="#a5213c" stroke-width="2"/><text x="370" y="45" fill="#a5213c">Invocation owns the execution</text><rect x="215" y="68" width="140" height="58" rx="4" fill="#edf3f7"/><text x="285" y="103" fill="#17334a">Use case</text><rect x="385" y="68" width="140" height="58" rx="4" fill="#edf3f7"/><text x="455" y="103" fill="#17334a">Repository</text><rect x="267" y="160" width="210" height="55" rx="4" fill="#edf3f7"/><text x="372" y="193" fill="#17334a">Session + transaction</text><rect x="603" y="68" width="145" height="58" rx="4" fill="#17334a"/><text x="675" y="103" fill="#fff">Order.confirm</text><g stroke="#526779" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M147 75H205"/><path d="M355 97H382"/><path d="M525 97H600"/><path d="M455 127V156"/></g><text x="80" y="158" font-size="13" fill="#526779">Normalize input</text><text x="675" y="158" font-size="13" fill="#526779">Decide the invariant</text></g></svg>
